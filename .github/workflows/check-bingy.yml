name: Check Bingy Goals

env:
    BRANCH: '22-implement-bingy'
    LABEL: 'bingy'

    REMOTE_GOALS_FILE: 'https://raw.githubusercontent.com/Zhetadelta/Silksong.BingoGenerator/refs/heads/main/assets/generated/silksong_readable.md'
    REMOTE_GOALS_REGEX: '(?<=\*\*)(.+)(?=\*\*)'
    REMOTE_OUTPUT_FILE: '/tmp/remote.txt'

    LOCAL_GOALS_FILES: |
        Resources/Goals/BingySet-Manual.json
        Resources/Goals/BingySet.json
    LOCAL_GOALS_FILTER: '.goals[].name'
    LOCAL_OUTPUT_FILE: '/tmp/local.txt'


on:
    workflow_dispatch:

permissions:
    issues: write

jobs:
    check-goals:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repo
                uses: actions/checkout@v4
                with:
                    ref: ${{ env.BRANCH }}

            -   name: Extract Remote Goals
                run: |
                    RAW_GOALS=$(curl "$GOALS_URL")
                    GOALS=$(echo "$RAW_GOALS" | grep -Po "$GOALS_REGEX" | sort -u)
                    echo "$GOALS" > "$OUTPUT_FILE"
                env:
                    GOALS_URL: ${{ env.REMOTE_GOALS_FILE }}
                    GOALS_REGEX: ${{ env.REMOTE_GOALS_REGEX }}
                    OUTPUT_FILE: ${{ env.REMOTE_OUTPUT_FILE }}

            -   name: Extract Local Goals
                run: |
                    > "$OUTPUT_FILE"

                    while IFS= read -r FILE; do
                        [[ -z "$FILE" ]] && continue
                        jq -r "$GOALS_FILTER" "$FILE" >> "$OUTPUT_FILE"
                    done <<< "$GOALS_FILES"

                    sort -u -o "$OUTPUT_FILE" "$OUTPUT_FILE"
                env:
                    GOALS_FILES: ${{ env.LOCAL_GOALS_FILES }}
                    GOALS_FILTER: ${{ env.LOCAL_GOALS_FILTER }}
                    OUTPUT_FILE: ${{ env.LOCAL_OUTPUT_FILE }}

            -   name: Compare Goals
                id: compare
                run: |
                    ADDED=$(comm -13 "$LOCAL" "$REMOTE")
                    REMOVED=$(comm -23 "$LOCAL" "$REMOTE")
                    
                    {
                        echo "added<<EOF"
                        echo "$ADDED"
                        echo "EOF"
                        echo "removed<<EOF"
                        echo "$REMOVED"
                        echo "EOF"
                    } >> "$GITHUB_OUTPUT"
                    
                    if [[ -n "$ADDED" || -n "$REMOVED" ]]; then
                      echo "has_diff=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "has_diff=false" >> "$GITHUB_OUTPUT"
                    fi
                env:
                    LOCAL: ${{ env.LOCAL_OUTPUT_FILE }}
                    REMOTE: ${{ env.REMOTE_OUTPUT_FILE }}

            -   name: Create Issue
                if: steps.compare.outputs.has_diff == 'true'
                run: |
                    gh issue create \
                        --title "[BINGY] Goals list changed ($(date -u +%Y-%m-%d))" \
                        --label "$LABEL" \
                        --body "$(cat <<EOF
Comparison of goals from [\`${BRANCH}\`](${BRANCH_URL}) against the upstream source.

**Added:**
\`\`\`
${ADDED:-(none)}
\`\`\`

**Removed:**
\`\`\`
${REMOVED:-(none)}
\`\`\`

<sub>This issue was generated by [an automated workflow](${WORKFLOW_URL}).</sub>
EOF
)"
                env:
                    WORKFLOW_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    BRANCH_URL: "${{ github.server_url }}/${{ github.repository }}/tree/${{ env.BRANCH }}"
                    BRANCH: ${{ env.BRANCH }}
                    ADDED: ${{ steps.compare.outputs.added }}
                    REMOVED: ${{ steps.compare.outputs.removed }}
                    LABEL: ${{ env.LABEL }}
                  